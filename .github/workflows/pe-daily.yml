# Daily append-only refresh of PE seeds (DefiLlama revenue + CoinGecko market), freezing T-2.
name: pe-daily

on:
  schedule:
    - cron: "7 1 * * *"   # 01:07 UTC = 09:07 Beijing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-append      # shared with btc-daily / btc-dominance so pushes never race
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # optional; notification skipped when unset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Append new days
        id: append
        # Partial success still commits; a non-zero exit is re-raised after the commit so GitHub e-mails.
        run: node .github/scripts/append_pe.cjs | tee /tmp/append.log; [ "${PIPESTATUS[0]}" = 0 ] || echo "failed=1" >> "$GITHUB_OUTPUT"
        shell: bash {0}
      - name: Commit if changed
        run: |
          if git diff --quiet -- pe-data; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pe-data
          msg="PE data: daily append (T-2 $(date -u -d '2 days ago' +%F))"
          if [ -n "$BURN" ]; then msg="$BURN; $msg"; fi
          git commit -m "$msg"
          git pull --rebase
          git push
        env:
          BURN: ${{ steps.append.outputs.burn }}
      - name: Notify Discord on new BNB burn
        if: steps.append.outputs.burn != '' && env.DISCORD_WEBHOOK != ''
        env:
          BURN: ${{ steps.append.outputs.burn }}
        run: |
          body=$(python3 -c 'import json,os;print(json.dumps({"content":"🔥 value.miao77.xyz 已自动录入："+os.environ["BURN"]+"（已在 BSC 链上核对）"}))')
          curl -sf -H 'content-type: application/json' -d "$body" "$DISCORD_WEBHOOK" >/dev/null
      - name: Daily summary to Discord
        if: success() && env.DISCORD_WEBHOOK != ''
        run: python3 .github/scripts/notify.py pe /tmp/append.log
      - name: Report failures
        if: steps.append.outputs.failed == '1'
        run: echo "::error::Some PE files were not updated; see the Append step log" && exit 1
      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        run: |
          body=$(python3 -c 'import json,os;print(json.dumps({"content":"⚠️ value.miao77.xyz 数据任务失败："+os.environ["GITHUB_WORKFLOW"]+" "+os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]}))')
          curl -sf -H 'content-type: application/json' -d "$body" "$DISCORD_WEBHOOK" >/dev/null
