# Daily append for copy-data/daily.json (reverse copy-trading account, Beijing-day close, append-only).
name: copy-daily

on:
  schedule:
    - cron: "5 16 * * *"   # 16:05 UTC = 00:05 Beijing; records the Beijing day that just ended
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-append      # shared with other data jobs so pushes never race
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # optional; notification skipped when unset
    steps:
      - uses: actions/checkout@v4
      - name: Append finished days
        run: python3 .github/scripts/append_copy.py | tee /tmp/append.log
        shell: bash -o pipefail {0}
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- copy-data/daily.json)" ]; then
            echo "no change"; exit 0
          fi
          last=$(python3 -c "import json;print(json.load(open('copy-data/daily.json'))['rows'][-1]['d'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add copy-data/daily.json
          git commit -m "Copy-trade data: append through $last"
          git pull --rebase
          git push
      - name: Daily summary to Discord
        if: success() && env.DISCORD_WEBHOOK != ''
        run: python3 .github/scripts/notify.py copy /tmp/append.log
      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        run: |
          body=$(python3 -c 'import json,os;print(json.dumps({"content":"⚠️ value.miao77.xyz 数据任务失败："+os.environ["GITHUB_WORKFLOW"]+" "+os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]}))')
          curl -sf -H 'content-type: application/json' -d "$body" "$DISCORD_WEBHOOK" >/dev/null
