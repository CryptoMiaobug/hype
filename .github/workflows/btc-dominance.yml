# Daily BTC dominance append for btc.html (CoinGecko /global → btc-data/dominance.json).
name: btc-dominance-daily

on:
  schedule:
    - cron: "7 0 * * *"   # 00:07 UTC; records UTC yesterday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-append      # shared with other data jobs so pushes never race
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # optional; notification skipped when unset
    steps:
      - uses: actions/checkout@v4
      - name: Append yesterday
        run: python3 .github/scripts/append_dominance.py | tee /tmp/append.log
        shell: bash -o pipefail {0}
      - name: Commit if changed
        run: |
          if git diff --quiet -- btc-data/dominance.json; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-data/dominance.json
          git commit -m "BTC dominance: append $(date -u -d yesterday +%F)"
          git pull --rebase
          git push
      - name: Daily summary to Discord
        if: success() && env.DISCORD_WEBHOOK != ''
        run: python3 .github/scripts/notify.py dominance /tmp/append.log
      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        run: |
          body=$(python3 -c 'import json,os;print(json.dumps({"content":"⚠️ value.miao77.xyz 数据任务失败："+os.environ["GITHUB_WORKFLOW"]+" "+os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]}))')
          curl -sf -H 'content-type: application/json' -d "$body" "$DISCORD_WEBHOOK" >/dev/null
