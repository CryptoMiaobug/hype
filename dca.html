<h1 data-i18n="dca.title">DCA 定投建议</h1>
<p class="pe-muted" data-i18n="dca.subtitle">按当前 PE 在近 1 年的分位调整每期定投金额 · 分位线与 PE 图上的 P20/P50/P80 虚线一致</p>
<div class="dca-base"><label for="base" data-i18n="dca.baseLabel">每个币种的基准定投金额（USD）</label><input id="base" type="number" inputmode="decimal" min="0" step="any" value="100"></div>
<p id="total" role="status" aria-live="polite"></p>
<div class="dca-grid" id="cards"><p class="pe-muted">…</p></div>
<section class="panel dca-rules"><h3 data-i18n="dca.rules">规则</h3><ul>
<li style="--c:#4ADE80" data-i18n="dca.r1">低于 20 分位：绿色，加倍定投（× 2）</li>
<li style="--c:#FACC15" data-i18n="dca.r2">20–50 分位：黄色，正常定投（× 1）</li>
<li style="--c:#FB923C" data-i18n="dca.r3">50–80 分位：橙色，减半定投（× 0.5）</li>
<li style="--c:#F87171" data-i18n="dca.r4">高于 80 分位：红色，停止定投（× 0）</li>
</ul><p class="pe-muted" data-i18n="dca.note"></p></section>
